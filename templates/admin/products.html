{% extends "admin/base.html" %}{% from "_svg.html" import art %}
{% block admin %}
<h3 class="brush">Add product</h3>
<form method="post" action="{{ url_for('product_save') }}" enctype="multipart/form-data" class="row">
<input name="name" placeholder="Name" required><select name="cat">{% for k, n in cats %}<option value="{{ k }}">{{ n }}</option>{% endfor %}</select>
<input name="price" type="number" step="0.01" min="0" placeholder="Price" required><label><input type="checkbox" name="stock" checked> In stock</label><input type="file" name="image" accept="image/*"><button class="btn">ADD</button></form>
<h3 class="brush">Products ({{ products|length }})</h3>
{% for p in products %}<form method="post" action="{{ url_for('product_save') }}" enctype="multipart/form-data" class="row"><input type="hidden" name="id" value="{{ p.id }}">
<input name="name" value="{{ p.name }}" required><select name="cat">{% for k, n in cats %}<option value="{{ k }}" {{ 'selected' if k == p.cat }}>{{ n }}</option>{% endfor %}</select>
<input name="price" type="number" step="0.01" min="0" value="{{ p.price }}"><label><input type="checkbox" name="stock" {{ 'checked' if p.stock }}> In stock</label>
<span><span class="mini">{{ art(p) }}</span><input type="file" name="image" accept="image/*"></span>
<span><button class="btn o">SAVE</button> <button class="btn o" formaction="{{ url_for('product_delete', pid=p.id) }}" onclick="return confirm('Delete this product?')">DELETE</button></span></form>{% endfor %}
{% endblock %}
